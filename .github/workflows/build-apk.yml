name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          API_URL="${{ secrets.API_URL || vars.API_URL || secrets.VITE_API_URL || vars.VITE_API_URL || 'https://qist.restora.live/api/v1' }}"
          echo "Building APK pointing to: $API_URL"
          ./gradlew :app:check :app:assembleDebug -Pqist.apiUrl.debug="$API_URL" --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: qist-locker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Manual branch builds produce a test update; they never overwrite Cloudflare's production object.
      - name: Build signed validation APK
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing signing setting $key"; exit 1; fi
          done
          umask 077
          SIGNING_FILE="$RUNNER_TEMP/locker-validation.jks"
          trap 'rm -f "$SIGNING_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
          API_URL="${{ secrets.API_URL || vars.API_URL || secrets.VITE_API_URL || vars.VITE_API_URL || 'https://qist.restora.live/api/v1' }}"
          ./gradlew :app:assembleRelease -Pqist.apiUrl.release="$API_URL" \
            -Pqist.signing.storeFile="$SIGNING_FILE" \
            -Pqist.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pqist.signing.keyAlias="$KEY_ALIAS" \
            -Pqist.signing.keyPassword="$KEY_PASSWORD" --no-daemon
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed validation APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: qist-locker-signed-validation-${{ github.run_id }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest Android APK
          body: |
            Automated build from `main` branch.
            Download `app-debug.apk` below.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
