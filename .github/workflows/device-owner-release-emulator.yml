name: Verify Device Owner release on Android Emulator

on:
  push:
    branches:
      - qa/device-owner-release-emulator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Android API ${{ matrix.api-level }} Device Owner release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug app and instrumentation APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Boot a clean emulator and verify Device Owner release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            trap 'adb logcat -d -v threadtime > "emulator-logcat-api-${{ matrix.api-level }}.txt" || true; adb shell dumpsys device_policy > "emulator-device-policy-api-${{ matrix.api-level }}.txt" || true' EXIT

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            adb shell dpm set-device-owner pk.qist.device/.deviceadmin.QistAdminReceiver
            adb shell dumpsys device_policy

            adb shell am instrument -w -r pk.qist.device.test/androidx.test.runner.AndroidJUnitRunner

            uninstall_output="$(adb shell pm uninstall --user 0 pk.qist.device)"
            echo "$uninstall_output"
            grep -q "Success" <<< "$uninstall_output"

            if adb shell pm path pk.qist.device >/dev/null 2>&1; then
              echo "::error::Qist package is still installed after release"
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qist-release-emulator-api-${{ matrix.api-level }}
          path: |
            emulator-logcat-api-${{ matrix.api-level }}.txt
            emulator-device-policy-api-${{ matrix.api-level }}.txt
          if-no-files-found: ignore
          retention-days: 7
